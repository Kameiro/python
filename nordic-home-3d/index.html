<div class="info" id="info"><div class="kicker">概念布局</div><h2>全屋鸟瞰</h2><p>基于你现有户型图搭建的北欧风 V1。客厅保留约 2.0m 直排沙发；主卧阳台作为轻型 Maker Space；客厅阳台偏家务使用。</p><div class="badge">鼠标拖动旋转 · 滚轮缩放 · 手机单指旋转</div></div>
